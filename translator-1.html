<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중문 소설 번역기 — DeepSeek</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Serif+SC:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0c0a; --surface: #161310; --border: #2a2420;
    --border-bright: #3d342c; --accent: #c9923a; --accent-dim: #7a5520;
    --text: #e8ddd0; --text-dim: #8a7a6a; --text-muted: #4a3f35;
    --red: #c94a3a; --green: #4a9a5a;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Serif KR', serif; min-height: 100vh; display: flex; flex-direction: column; }

  header { border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); flex-wrap: wrap; gap: 10px; }
  .logo { display: flex; align-items: baseline; gap: 10px; }
  .logo-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--accent); letter-spacing: 4px; }
  .logo-kr { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }
  .api-area { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .api-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .api-input { background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 12px; padding: 7px 10px; width: 200px; outline: none; transition: border-color 0.2s; }
  .api-input:focus { border-color: var(--accent-dim); }

  main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; max-width: 1100px; width: 100%; margin: 0 auto; }

  /* 프롬프트 설정 영역 */
  .prompt-settings { background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 4px; }
  .prompt-settings summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; user-select: none; display: flex; align-items: center; gap: 8px; outline: none; }
  .prompt-settings summary::-webkit-details-marker { display: none; }
  .prompt-settings summary::before { content: '▶'; font-size: 10px; transition: transform 0.2s; }
  .prompt-settings[open] summary::before { transform: rotate(90deg); }
  .prompt-textarea { width: 100%; min-height: 180px; background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); font-family: 'Noto Serif KR', serif; font-size: 13px; padding: 12px; margin-top: 12px; resize: vertical; outline: none; line-height: 1.7; }
  .prompt-textarea:focus { border-color: var(--accent-dim); color: var(--text); }
  .prompt-hint { margin-top: 8px; font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-family: 'Noto Serif KR', serif; font-size: 13px; padding: 9px 18px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; margin-bottom: -1px; }
  .tab-btn:hover { color: var(--text-dim); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .panel { display: none; }
  .panel.active { display: flex; flex-direction: column; gap: 12px; }

  /* TEXT */
  .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .editors { grid-template-columns: 1fr; } }
  .editor-wrap { display: flex; flex-direction: column; gap: 6px; }
  .editor-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 6px; }
  .editor-label span { font-family: 'Noto Serif SC', serif; font-size: 13px; color: var(--accent-dim); }
  textarea { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Noto Serif KR', serif; font-size: 14px; line-height: 1.9; padding: 16px; resize: vertical; min-height: 300px; outline: none; transition: border-color 0.2s; width: 100%; }
  textarea:focus { border-color: var(--border-bright); }
  textarea::placeholder { color: var(--text-muted); }

  /* FILE */
  #fileInput { display: none; }
  .upload-area { background: var(--surface); border: 1px solid var(--border); padding: 28px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .upload-icon { font-size: 36px; }
  .upload-desc { font-size: 14px; color: var(--text-dim); }
  .upload-file-label { display: inline-block; background: var(--accent); color: #0e0c0a; font-family: 'Noto Serif KR', serif; font-size: 14px; font-weight: 600; padding: 12px 36px; cursor: pointer; letter-spacing: 1px; user-select: none; -webkit-tap-highlight-color: transparent; }
  .upload-formats { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .file-info { display: none; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); padding: 10px 16px; }
  .file-info.visible { display: flex; }
  .file-name { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  /* CONTROLS */
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn { border: none; padding: 10px 20px; font-family: 'Noto Serif KR', serif; font-size: 13px; cursor: pointer; transition: all 0.15s; letter-spacing: 1px; -webkit-tap-highlight-color: transparent; }
  .btn-primary { background: var(--accent); color: #0e0c0a; font-weight: 600; }
  .btn-primary:hover { background: #d9a34a; }
  .btn-primary:disabled { background: var(--accent-dim); color: var(--text-muted); cursor: not-allowed; }
  .btn-ghost { background: none; border: 1px solid var(--border-bright); color: var(--text-dim); }
  .btn-ghost:hover { border-color: var(--accent-dim); color: var(--accent); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-danger { background: none; border: 1px solid var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-danger:disabled { opacity: 0.3; cursor: not-allowed; }

  .filename-input { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 12px; padding: 9px 10px; outline: none; width: 160px; transition: border-color 0.2s; }
  .filename-input:focus { border-color: var(--accent-dim); }
