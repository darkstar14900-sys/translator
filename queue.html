<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>번역 큐 — 원격 실행</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0e0c0a;--surface:#161310;--border:#2a2420;--border-bright:#3d342c;
    --accent:#c9923a;--text:#e8ddd0;--text-dim:#8a7a6a;--text-muted:#4a3f35;
    --red:#c94a3a;--green:#4a9a5a;--yellow:#c9b03a;}
  body{background:var(--bg);color:var(--text);font-family:sans-serif;min-height:100vh;padding:16px;max-width:640px;margin:0 auto;}
  h1{font-size:18px;color:var(--accent);margin-bottom:4px;}
  .sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;}
  section{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:14px;}
  section h2{font-size:13px;color:var(--accent);margin-bottom:10px;}
  label{display:block;font-size:11px;color:var(--text-muted);margin:8px 0 4px;}
  input[type=text],input[type=password],select,textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;font-size:13px;border-radius:4px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{min-height:110px;resize:vertical;line-height:1.6;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  button{width:100%;border:none;background:var(--accent);color:#0e0c0a;font-weight:700;
    padding:12px;border-radius:4px;font-size:14px;cursor:pointer;margin-top:10px;}
  button:disabled{background:var(--border-bright);color:var(--text-muted);}
  button.ghost{background:none;border:1px solid var(--border-bright);color:var(--text-dim);}
  .msg{font-size:12px;color:var(--text-dim);margin-top:8px;white-space:pre-wrap;}
  .msg.err{color:var(--red);}
  .msg.ok{color:var(--green);}
  .job{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;margin-top:8px;font-size:12px;}
  .job .name{color:var(--accent);word-break:break-all;}
  .job .meta{color:var(--text-muted);margin:4px 0;}
  .job a{color:var(--green);font-weight:700;text-decoration:none;}
  .upload-btn{display:inline-block;background:var(--border-bright);padding:8px 12px;border-radius:4px;
    font-size:12px;cursor:pointer;margin-top:6px;}
  .slot{border-top:1px dashed var(--border);padding-top:12px;margin-top:12px;}
  .slot:first-child{border-top:none;padding-top:0;margin-top:0;}
  .slot-title{font-size:12px;color:var(--yellow);font-weight:700;margin-bottom:2px;}
  .hint{font-size:10.5px;color:var(--text-muted);margin-top:3px;line-height:1.5;}
  details{margin-top:10px;border:1px dashed var(--border-bright);border-radius:4px;padding:8px 10px;}
  details summary{font-size:12px;color:var(--text-dim);cursor:pointer;}
  .cfg-note{font-size:11px;color:var(--text-dim);margin:2px 0 6px;line-height:1.5;}
  input[type=number]{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;font-size:13px;border-radius:4px;outline:none;}
  textarea.prompt{min-height:90px;font-size:12px;}
</style>
</head>
<body>

<h1>譯 번역 큐 — 원격 실행</h1>
<div class="sub">폰에서 텍스트만 올리면 GitHub Actions 서버가 번역합니다. 화면을 꺼도 계속 진행돼요.</div>

<section>
  <h2>⚙ 저장소 설정 (최초 1회)</h2>
  <label>GitHub Personal Access Token</label>
  <input type="password" id="pat" placeholder="ghp_... 또는 github_pat_...">
  <div class="row">
    <div>
      <label>저장소 소유자 (owner)</label>
      <input type="text" id="owner" placeholder="예: darkstar14900-sys">
    </div>
    <div>
      <label>저장소 이름 (repo)</label>
      <input type="text" id="repo" placeholder="예: translator">
    </div>
  </div>
  <label>브랜치</label>
  <input type="text" id="branch" value="main">
</section>

<section>
  <h2>🎛 번역 설정 (모든 소설 공통)</h2>
  <div class="cfg-note">비워두면 기존 기본값으로 번역해요. 값은 이 폰에 저장됩니다. 소설마다 다르게 하고 싶으면 아래 각 슬롯의 "이 소설만 다르게"를 쓰세요.</div>
  <div id="common-cfg"></div>
</section>

<section>
  <h2>📄 번역할 원문 (최대 3개 동시 등록, 비워두면 건너뜁니다)</h2>

  <div id="slots"></div>

  <button id="btn-send">🚀 전체 번역 요청 보내기</button>
  <div class="msg" id="send-msg"></div>
</section>

<section>
  <h2>📋 보낸 작업 목록</h2>
  <div id="jobs"></div>
</section>

<script>
const $ = id => document.getElementById(id);
const SLOTS = [1,2,3];

const MODELS = [
  ['deepseek/deepseek-v4-flash','DeepSeek V4 Flash (가장 저렴, 기본값)'],
  ['deepseek/deepseek-v4.1-flash','DeepSeek V4.1 Flash (최신, 조금 더 비쌈)'],
  ['deepseek/deepseek-chat','DeepSeek V3 (deepseek-chat, 예전 버전)'],
  ['deepseek/deepseek-r1','DeepSeek R1'],
  ['qwen/qwen3.5-plus-20260420','Qwen 3.5 Plus (중국어 이해력 강점, 검열 완화)'],
  ['z-ai/glm-5.3-flash','GLM 5.3 Flash (매우 저렴)'],
  ['x-ai/grok-2-1212','Grok 2'],
  ['google/gemini-2.0-flash-001','Gemini 2.0 Flash'],
  ['nousresearch/hermes-3-llama-3.1-405b','Hermes 3 (405B)'],
  ['sao10k/l3.1-euryale-70b','Euryale 70B'],
  ['neversleep/llama-3.1-lumimaid-70b','Lumimaid 70B']
];

// 튜닝 항목 정의 (기본값은 translate.js 의 기존 동작과 동일)
const FIELDS = [
  {key:'chunkSize', label:'청크 크기 (글자 수)', type:'number', ph:'1500', hint:'크게 하면 API 호출 횟수(반복되는 프롬프트 비용)가 줄지만 문맥 오류·누락 위험이 커져요. 권장 1000~3000'},
  {key:'temperature', label:'온도 (Temperature)', type:'number', step:'0.1', ph:'0.1', hint:'낮을수록 원문에 충실, 높을수록 자유로운 표현. 번역은 0~0.5 권장'},
  {key:'maxTokens', label:'최대 출력 토큰', type:'number', ph:'자동 (청크 크기에 맞춤)', hint:'청크를 크게 키우면 자동으로 늘어나요. 번역이 중간에 잘리면 올리세요'},
  {key:'concurrency', label:'동시 요청 수', type:'number', ph:'1', hint:'1~8. 올리면 빨라지지만 429(요청 한도) 오류가 늘 수 있고, 새 이름 표기집 반영이 한 묶음씩 늦어져요'},
  {key:'retries', label:'청크당 재시도 횟수', type:'number', ph:'5', hint:'실패 시 다시 시도하는 최대 횟수 (1~10)'},
  {key:'glossary', label:'고유명사 표기집', type:'select', opts:[['on','사용 (기본)'],['off','끄기']]},
  {key:'reasoning', label:'Thinking(추론)', type:'select', opts:[['default','모델 기본값'],['off','끄기 (빠르고 저렴)']], hint:'모델이 지원하지 않으면 자동으로 무시하고 진행해요'},
  {key:'prompt', label:'번역 프롬프트 (직접 수정)', type:'textarea', ph:'비워두면 기본 프롬프트 사용 (저장소 prompt.txt가 있으면 그 파일)', hint:'새 이름을 표기집에 자동 추가하려면 기본 프롬프트의 ###NEW_NAMES### 규칙을 유지해야 해요'}
];

function fieldHTML(prefix, f, isSlot){
  const id = prefix + f.key;
  let ctl = '';
  if (f.type === 'select') {
    const first = isSlot ? '<option value="">공통값 사용</option>' : '';
    ctl = `<select id="${id}">${first}${f.opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctl = `<textarea class="prompt" id="${id}" placeholder="${isSlot ? '공통값 사용' : f.ph}"></textarea>`;
  } else {
    ctl = `<input type="number" inputmode="decimal" id="${id}" ${f.step?`step="${f.step}"`:''} placeholder="${isSlot ? '공통값 사용' : f.ph}">`;
  }
  return `<label>${f.label}</label>${ctl}${(!isSlot && f.hint) ? `<div class="hint">${f.hint}</div>` : ''}`;
}

// 공통 설정 UI + 저장
$('common-cfg').innerHTML = FIELDS.map(f => fieldHTML('cfg-', f, false)).join('');
FIELDS.forEach(f => {
  const el = $('cfg-'+f.key);
  const saved = localStorage.getItem('tq_cfg_'+f.key);
  if (saved !== null) el.value = saved;
  ['input','change'].forEach(ev => el.addEventListener(ev, () => localStorage.setItem('tq_cfg_'+f.key, el.value)));
});

// 슬롯 UI
const SLOT_NAMES = ['① 첫 번째 소설','② 두 번째 소설','③ 세 번째 소설'];
$('slots').innerHTML = SLOTS.map((idx, n) => `
  <div class="slot" data-slot="${idx}">
    <div class="slot-title">${SLOT_NAMES[n]}</div>
    <label>중국어 원문 붙여넣기</label>
    <textarea id="text-input-${idx}" placeholder="여기에 붙여넣기...${idx>1?' (없으면 비워두세요)':''}"></textarea>
    <label class="upload-btn" for="file-input-${idx}">또는 .txt 파일 선택</label>
    <input type="file" id="file-input-${idx}" accept=".txt" hidden>
    <label>모델</label>
    <select id="model-${idx}">${MODELS.map((m,i)=>`<option value="${m[0]}"${i===0?' selected':''}>${m[1]}</option>`).join('')}</select>
    <details>
      <summary>이 소설만 다르게 설정 (선택)</summary>
      ${FIELDS.map(f => fieldHTML('s'+idx+'-', f, true)).join('')}
    </details>
  </div>`).join('');

// 슬롯 값이 있으면 그것을, 없으면 공통값을 사용해 설정 객체 생성 (비어 있는 항목은 아예 넣지 않음 → translate.js 기본값)
function buildConfig(idx){
  const cfg = {};
  FIELDS.forEach(f => {
    let v = ($('s'+idx+'-'+f.key).value || '').trim();
    if (v === '') v = ($('cfg-'+f.key).value || '').trim();
    if (v === '') return;
    if (f.type === 'number') {
      const n = Number(v);
      if (isFinite(n)) cfg[f.key] = n;
    } else {
      cfg[f.key] = v;
    }
  });
  return cfg;
}
function cfgSummary(cfg){
  const parts = [];
  if (cfg.chunkSize) parts.push('청크 '+cfg.chunkSize);
  if (cfg.temperature !== undefined) parts.push('온도 '+cfg.temperature);
  if (cfg.concurrency) parts.push('동시 '+cfg.concurrency);
  if (cfg.reasoning === 'off') parts.push('추론 끔');
  if (cfg.glossary === 'off') parts.push('표기집 끔');
  if (cfg.prompt) parts.push('커스텀 프롬프트');
  return parts.join(' · ');
}

// ── 설정값 로컬 저장 ──
['pat','owner','repo','branch'].forEach(id=>{
  const saved = localStorage.getItem('tq_'+id);
  if (saved) $(id).value = saved;
  $(id).addEventListener('input', e => localStorage.setItem('tq_'+id, e.target.value));
});

SLOTS.forEach(idx=>{
  $('file-input-'+idx).addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    $('text-input-'+idx).value = await f.text();
  });
});

function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function b64ToUtf8(b64){
  const binary = atob(b64.replace(/\n/g,''));
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + $('pat').value.trim(),
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}

function loadJobs(){
  return JSON.parse(localStorage.getItem('tq_jobs') || '[]');
}
function saveJobs(jobs){
  localStorage.setItem('tq_jobs', JSON.stringify(jobs));
}

// GitHub 연속 커밋 시 간헐적으로 나는 409(충돌)를 짧게 기다렸다 재시도
async function putFile(owner, repo, path, content, message, branch){
  let lastErr = '';
  for (let t = 0; t < 4; t++) {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: ghHeaders(),
      body: JSON.stringify({ message, content: utf8ToB64(content), branch })
    });
    if (res.ok) return;
    const e = await res.json().catch(()=>({}));
    lastErr = e.message || res.status;
    if (res.status !== 409 && res.status !== 422 && res.status < 500) break;
    await sleep(1500 * (t + 1));
  }
  throw new Error(lastErr);
}

// idx번 슬롯 하나를 업로드+실행. 텍스트 없으면 null 반환(건너뜀). 실패 시 throw.
async function uploadSlot(idx){
  const text = $('text-input-'+idx).value.trim();
  if (!text) return null;

  const owner = $('owner').value.trim();
  const repo = $('repo').value.trim();
  const branch = $('branch').value.trim() || 'main';
  const model = $('model-'+idx).value;

  const baseName = 'input-' + Date.now() + '-s' + idx;
  const path = `queue/${baseName}.txt`;

  try {
    await putFile(owner, repo, path, text, `번역 요청: ${baseName}`, branch);
  } catch (err) {
    throw new Error(`[슬롯${idx}] 업로드 실패: ${err.message}`);
  }

  // 번역 설정 파일 (원문과 같은 이름 + .config.json) - translate.js 가 읽어서 적용
  const cfg = buildConfig(idx);
  if (Object.keys(cfg).length) {
    try {
      await putFile(owner, repo, `queue/${baseName}.config.json`, JSON.stringify(cfg, null, 2), `번역 설정: ${baseName}`, branch);
    } catch (err) {
      throw new Error(`[슬롯${idx}] 설정 파일 업로드 실패: ${err.message}`);
    }
  }

  const dispatchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/translate.yml/dispatches`, {
    method: 'POST',
    headers: ghHeaders(),
    body: JSON.stringify({
      ref: branch,
      inputs: { input_file: path, model }
    })
  });
  if (!dispatchRes.ok) {
    const e = await dispatchRes.json().catch(()=>({}));
    throw new Error(`[슬롯${idx}] 실행 트리거 실패: ${e.message || dispatchRes.status}`);
  }

  return { baseName, model, idx, cfg: cfgSummary(cfg) };
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

$('btn-send').addEventListener('click', async () => {
  const pat = $('pat').value.trim();
  const owner = $('owner').value.trim();
  const repo = $('repo').value.trim();
  const msgEl = $('send-msg');

  if (!pat || !owner || !repo) { msgEl.textContent = '저장소 설정을 먼저 입력해주세요.'; msgEl.className='msg err'; return; }

  const filled = SLOTS.filter(idx => $('text-input-'+idx).value.trim());
  if (!filled.length) { msgEl.textContent = '최소 1개 슬롯에 원문을 입력해주세요.'; msgEl.className='msg err'; return; }

  const btn = $('btn-send');
  btn.disabled = true; btn.textContent = '전송 중...';
  msgEl.className = 'msg'; msgEl.textContent = '';

  const jobs = loadJobs();
  const results = [];

  for (const idx of filled) {
    msgEl.textContent = `슬롯 ${idx} 업로드 중... (${results.length+1}/${filled.length})`;
    try {
      const r = await uploadSlot(idx);
      if (r) {
        jobs.unshift({ baseName: r.baseName, sentAt: new Date().toLocaleString('ko-KR'), model: r.model, cfg: r.cfg, done:false });
        $('text-input-'+idx).value = '';
        results.push({ idx, ok:true });
      }
    } catch (err) {
      results.push({ idx, ok:false, error: err.message });
    }
    // GitHub API/워크플로우 동시 트리거 간 커밋 충돌 가능성을 줄이기 위한 간격
    if (idx !== filled[filled.length-1]) await sleep(2500);
  }

  saveJobs(jobs);
  renderJobs();

  const okCount = results.filter(r=>r.ok).length;
  const failMsgs = results.filter(r=>!r.ok).map(r=>r.error);
  if (failMsgs.length) {
    msgEl.textContent = `${okCount}개 성공, ${failMsgs.length}개 실패\n` + failMsgs.join('\n');
    msgEl.className = 'msg err';
  } else {
    msgEl.textContent = `${okCount}개 요청 완료! 아래 목록에서 진행 상황을 확인하세요.`;
    msgEl.className = 'msg ok';
  }

  btn.disabled = false; btn.textContent = '🚀 전체 번역 요청 보내기';
});

async function checkJob(baseName, el){
  const owner = $('owner').value.trim();
  const repo = $('repo').value.trim();
  const branch = $('branch').value.trim() || 'main';
  el.textContent = '확인 중...';

  const finalUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/output/${baseName}_번역본.txt`;
  const progUrl = `https://api.github.com/repos/${owner}/${repo}/contents/output/${baseName}.progress.json?ref=${branch}`;

  try {
    const finalRes = await fetch(finalUrl, { cache: 'no-store' });
    if (finalRes.ok) {
      el.innerHTML = `완료됨 ✅ <a href="${finalUrl}" target="_blank">⬇ 결과 열기/다운로드</a>`;
      const jobs = loadJobs().map(j => j.baseName === baseName ? {...j, done:true} : j);
      saveJobs(jobs);
      return;
    }
  } catch(e){}

  try {
    const progRes = await fetch(progUrl, { headers: ghHeaders() });
    if (progRes.ok) {
      const data = await progRes.json();
      const prog = JSON.parse(b64ToUtf8(data.content));
      el.textContent = `진행 중... ${prog.cursor}/${prog.total} (${((prog.cursor/prog.total)*100).toFixed(1)}%)`;
      return;
    }
  } catch(e){}

  el.textContent = '대기 중 (아직 워크플로우가 시작 전이거나 첫 저장 전일 수 있어요)';
}

function renderJobs(){
  const jobs = loadJobs();
  const wrap = $('jobs');
  if (!jobs.length) { wrap.innerHTML = '<div class="msg">보낸 작업이 없습니다.</div>'; return; }
  wrap.innerHTML = jobs.map((j,i) => `
    <div class="job">
      <div class="name">${j.baseName}</div>
      <div class="meta">${j.sentAt} · ${j.model}${j.cfg ? '<br>' + j.cfg : ''}</div>
      <div class="msg" id="status-${i}">확인 필요</div>
      <button class="ghost" onclick="checkJob('${j.baseName}', document.getElementById('status-${i}'))">🔄 상태 새로고침</button>
    </div>
  `).join('');
}
renderJobs();
</script>
</body>
</html>
